<!-- Default -->
<div class="combobox">
  <input role="combobox" aria-expanded="false" aria-controls="combobox-default-panel" aria-autocomplete="list" placeholder="Select a framework..." aria-label="Select a framework">
  <input type="hidden" data-slot="input" name="value">
  <div data-popover data-side="bottom" aria-hidden="true" id="combobox-default-panel">
    <div role="listbox" aria-label="Frameworks">
      <div role="option" aria-selected="false"><span data-slot="text">React</span></div>
      <div role="option" aria-selected="false"><span data-slot="text">Vue</span></div>
      <div role="option" aria-selected="false"><span data-slot="text">Svelte</span></div>
      <div data-slot="empty" hidden>No framework found.</div>
    </div>
  </div>
</div>

<!-- Single -->
<div class="combobox">
  <input role="combobox" aria-expanded="false" aria-controls="combobox-fruit-panel" aria-autocomplete="list" placeholder="Search fruit..." aria-label="Search fruit">
  <input type="hidden" data-slot="input" name="value">
  <button type="button" class="btn" data-variant="ghost" data-size="icon-xs" data-slot="clear" aria-label="Clear">×</button>
  <div data-popover data-side="bottom" aria-hidden="true" id="combobox-fruit-panel">
    <div role="listbox" aria-label="Fruit">
      <div role="option" aria-selected="false"><span data-slot="text">Apple</span></div>
      <div role="option" aria-selected="false"><span data-slot="text">Banana</span></div>
      <div role="option" aria-selected="false"><span data-slot="text">Orange</span></div>
      <div role="option" aria-selected="false"><span data-slot="text">Pineapple</span></div>
      <div data-slot="empty" hidden>No fruit found.</div>
    </div>
  </div>
</div>

<!-- Multiple -->
<div class="combobox">
  <input role="combobox" aria-expanded="false" aria-controls="combobox-tag-panel" aria-autocomplete="list" placeholder="Search tags..." aria-label="Search tags">
  <button type="button" class="btn" data-variant="ghost" data-size="icon-xs" data-slot="clear" aria-label="Clear">×</button>
  <div data-popover data-side="bottom" aria-hidden="true" id="combobox-tag-panel">
    <div role="listbox" aria-label="Tags" aria-multiselectable="true">
      <div role="option" aria-selected="true"><span data-slot="text">Design</span></div>
      <div role="option" aria-selected="false"><span data-slot="text">Engineering</span></div>
      <div role="option" aria-selected="true"><span data-slot="text">Docs</span></div>
      <div data-slot="empty" hidden>No tags found.</div>
    </div>
  </div>
</div>

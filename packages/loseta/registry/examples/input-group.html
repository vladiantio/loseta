<!-- Default -->
<div class="input-group" role="group" aria-label="Search">
  <span data-slot="addon" data-align="inline-start" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
  <input class="input" type="search" placeholder="Search components..." aria-label="Search components">
</div>

<!-- Inline addons -->
<div class="input-group" role="group" aria-label="Email">
  <span data-slot="addon" data-align="inline-start" aria-hidden="true">@</span>
  <input class="input" type="email" placeholder="you@example.com" aria-label="Email">
  <span data-slot="addon" data-align="inline-end">
    <button type="button" class="btn" data-variant="ghost" data-size="icon-xs" aria-label="Copy email"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
  </span>
</div>

<!-- Block addon -->
<div class="input-group" role="group" aria-label="Message">
  <span data-slot="addon" data-align="block-start">Message</span>
  <textarea class="textarea" placeholder="Type your message here." aria-label="Message"></textarea>
</div>

<!-- Default -->
<button type="button" class="toggle" aria-pressed="false">Bold</button>

<!-- Variants -->
<div style="display: flex; flex-wrap: wrap; gap: 0.5rem">
  <button type="button" class="toggle" aria-pressed="false">Bold</button>
  <button type="button" class="toggle" data-variant="outline" aria-pressed="true">Italic</button>
  <button type="button" class="toggle" data-variant="outline" aria-pressed="false" disabled>Underline</button>
</div>

<!-- Sizes -->
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem">
  <button type="button" class="toggle" data-size="sm" aria-pressed="false">Small</button>
  <button type="button" class="toggle" aria-pressed="false">Default</button>
  <button type="button" class="toggle" data-size="lg" aria-pressed="false">Large</button>
</div>
